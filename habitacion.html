<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="azulejo" src="textura_suelo.png">
        <img id="playa360" src="playa360.jpg">
        <video id="mivideo" src="mivideo.webm" autoplay loop ></video> 
      </a-assets>
      <a-video src="#mivideo" width="4" height="2.25" position="0 2 -4"></a-video>
      <a-box position="-1 0.5 -2" rotation="0 90 0" color="#4CC3D9" height="2" width="0.015" depth="10"></a-box> 
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-cylinder position="1 2.2.75 -3" radius="0.5" height="1.5" color="red"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" src="#azulejo"></a-plane>
      <a-cone position="0 4 -3" color="green"></a-cylinder>

      <a-sky src="#playa360"></a-sky>

      </a-light type= "directional" color="#ff7744" intensity="1" position= "-1 3 3"></a-light>

      </a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    </a-scene>
  </body>
</html>
