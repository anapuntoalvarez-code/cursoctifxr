<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Refugio Inmersivo - Isla 3D</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
</head>
<body>

    <a-scene>
        <a-entity environment="preset: forest; 
                               groundColor: #c2b280; 
                               groundColor2: #b19d6d; 
                               dressing: trees; 
                               dressingAmount: 15; 
                               dressingColor: #228b22;
                               skyType: gradient; 
                               skyColor: #24b5ff; 
                               horizonColor: #eff9ff; 
                               lighting: point;
                               playArea: 1.2;
                               flatShading: true">
        </a-entity>

        <a-ocean color="#0077be" width="100" depth="100" density="20" speed="2" position="0 -0.1 0"></a-ocean>

        <a-entity id="casa" position="0 0 -5">
            <a-box position="0 1.5 0" width="4" height="3" depth="4" color="#f5f5f5"></a-box>
            <a-cone position="0 4 0" radius-bottom="3.5" height="2" color="#8b4513" segments-radial="4"></a-cone>
            <a-box position="0 0.75 2.01" width="1" height="1.5" depth="0.1" color="#4e2c0e"></a-box>
            <a-box position="1.2 1.5 2.01" width="0.8" height="0.8" depth="0.1" color="#add8e6" opacity="0.7"></a-box>
        </a-entity>

        <a-entity position="-4 0 -3">
            <a-cylinder color="#5C4033" height="3" radius="0.15"></a-cylinder>
            <a-sphere color="#228b22" position="0 1.8 0" radius="1.2" scale="1 0.3 1"></a-sphere>
        </a-entity>
        
        <a-entity position="5 0 -6">
            <a-cylinder color="#5C4033" height="4" radius="0.2"></a-cylinder>
            <a-sphere color="#228b22" position="0 2.3 0" radius="1.5" scale="1 0.3 1"></a-sphere>
        </a-entity>

        <a-entity id="rig" position="0 1.6 4">
            <a-camera look-controls wasd-controls></a-camera>
        </a-entity>

        <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

    </a-scene>

</body>
</html>
